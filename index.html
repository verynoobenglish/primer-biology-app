<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রাতিষ্ঠানিক কাজের ড্যাশবোর্ড</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- হেডার বা শিরোনাম অংশ -->
    <header>
        <h1>কাজের প্যানেল ও ড্যাশবোর্ড</h1>
        <p>ব্যক্তিগত প্রাতিষ্ঠানিক ব্যবহারের জন্য</p>
    </header>

    <!-- মূল কন্টেন্ট এরিয়া -->
    <main class="container">
        
        <!-- সেকশন ১: তথ্য বা কন্টেন্ট টেবিল -->
        <section class="card">
            <h2>নমুনা কন্টেন্ট বা প্রশ্ন তালিকা</h2>
            <table>
                <thead>
                    <tr>
                        <th>ক্রমিক</th>
                        <th>টপিক / বিষয়</th>
                        <th>স্ট্যাটাস</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>০১</td>
                        <td>অধ্যায় ০১: কোষ ও এর গঠন</td>
                        <td><span class="badge সম্পন্ন">সম্পন্ন</span></td>
                    </tr>
                    <tr>
                        <td>০২</td>
                        <td>অধ্যায় ০২: কোষ বিভাজন</td>
                        <td><span class="badge বাকি">চলমান</span></td>
                    </tr>
                </tbody>
            </table>
        </section>

        <!-- সেকশন ২: তথ্য ইনপুট দেওয়ার ফর্ম (কাজ চলার মতো) -->
        <section class="card">
            <h2>নতুন তথ্য যুক্তকরণ ফর্ম</h2>
            <form>
                <div class="form-group">
                    <label for="topic">টপিকের নাম:</label>
                    <input type="text" id="topic" placeholder="এখানে লিখুন...">
                </div>
                <div class="form-group">
                    <label for="note">গুরুত্বপূর্ণ নোট বা মন্তব্য:</label>
                    <textarea id="note" rows="4" placeholder="মন্তব্য লিখুন..."></textarea>
                </div>
                <button type="button" class="btn">সংরক্ষণ করুন (খসড়া)</button>
            </form>
        </section>

    </main>

</body>
</html>
